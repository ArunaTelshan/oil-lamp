<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lamp Simulator</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 24px 16px; background: #0b0c16; color: #eee4cc; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-weight: 600; font-size: 22px; margin: 0 0 4px; }
    .warn { background: #3a1d12; border: 1px solid #a8532d; border-radius: 10px; padding: 10px 14px; margin: 14px 0; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 120px; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #15172a; color: inherit; font: inherit; }
    button { margin-top: 18px; padding: 12px 20px; border: 0; border-radius: 999px; background: #e9b860; color: #241507; font: 600 16px system-ui; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    pre { background: #15172a; border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; min-height: 120px; }
  </style>
</head>
<body>
<main>
  <h1>Lamp simulator</h1>
  <p>Fires fake guest taps at the backend, so you can rehearse a burst of guests and check that every tap gets its own lamp.</p>
  <p id="mode"></p>
  <div class="warn" id="warn" hidden>This writes to the <b>live Supabase database</b>. Afterwards, reset it in Supabase → SQL Editor:<br><code>select public.reset_ceremony();</code></div>
  <label for="count">Number of guests</label>
  <input id="count" type="number" min="1" max="200" value="140">
  <label for="secs">Spread over (seconds)</label>
  <input id="secs" type="number" min="0" max="600" value="60">
  <br><button id="go">Start</button>
  <pre id="out">Ready.</pre>
</main>
<script type="module">
  import { backendMode, lightLamp } from '../js/backend.js';
  const mode = backendMode();
  document.getElementById('mode').textContent = `Mode: ${mode}` + (mode === 'local' ? ' (open ../screen.html?local in this same browser to watch)' : '');
  if (mode === 'supabase') document.getElementById('warn').hidden = false;
  const out = document.getElementById('out');
  const letters = 'ABCDEFGHIJKLMNOPRSTUVY';
  const name = () => Array.from({ length: 2 + Math.floor(Math.random() * 3) }, () => letters[Math.floor(Math.random() * letters.length)]).join('');
  const uuid = () => crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2);

  document.getElementById('go').addEventListener('click', async e => {
    const btn = e.target;
    const n = +document.getElementById('count').value;
    const secs = +document.getElementById('secs').value;
    btn.disabled = true;
    const res = { ok: 0, full: 0, other: 0, failed: 0, lamps: [], ms: [] };
    const show = done => {
      const uniq = new Set(res.lamps).size;
      const sorted = [...res.ms].sort((a, b) => a - b);
      const pct = p => sorted.length ? Math.round(sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))]) : 0;
      out.textContent =
        `${done ? 'Finished' : 'Running'}: ${res.ok + res.full + res.other + res.failed} / ${n}\n` +
        `Lit: ${res.ok}   ·   unique lamp numbers: ${uniq}${uniq !== res.ok ? '  ⚠ DUPLICATES' : ''}\n` +
        `Full: ${res.full}   ·   refused: ${res.other}   ·   network failures: ${res.failed}\n` +
        `Response time: median ${pct(0.5)} ms · 95% ${pct(0.95)} ms · slowest ${pct(1)} ms`;
    };
    const jobs = [];
    for (let i = 0; i < n; i++) {
      const delay = secs ? Math.random() * secs * 1000 : 0;
      jobs.push(new Promise(r => setTimeout(r, delay)).then(async () => {
        const t0 = performance.now();
        try {
          const r = await lightLamp(name(), uuid());
          res.ms.push(performance.now() - t0);
          if (r.ok) { res.ok++; res.lamps.push(r.lamp); }
          else if (r.error === 'full') res.full++;
          else res.other++;
        } catch { res.failed++; }
        show(false);
      }));
    }
    await Promise.all(jobs);
    show(true);
    btn.disabled = false;
  });
</script>
</body>
</html>
